<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini GitHub Viewer</title>

<!-- Prism -->
<link href="https://cdn.jsdelivr.net/npm/prismjs/themes/prism-tomorrow.css" rel="stylesheet"/>

<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#0d1117;color:#c9d1d9;font-family:Consolas, monospace;height:100vh;overflow:hidden;}

/* ================= LOGIN ================= */
#loginPage{display:flex;justify-content:center;align-items:center;height:100vh;}
.login-box{width:320px;background:#161b22;padding:40px;border-radius:12px;box-shadow:0 0 20px rgba(0,0,0,0.5);}
.login-box h1{text-align:center;margin-bottom:25px;}
.login-box input{width:100%;padding:12px;margin-bottom:15px;border:none;outline:none;background:#0d1117;color:white;border:1px solid #30363d;border-radius:6px;}
.login-box button{width:100%;padding:12px;border:none;background:#238636;color:white;border-radius:6px;cursor:pointer;font-size:16px;}
.login-box button:hover{background:#2ea043;}

/* ================= APP ================= */
#app{display:none;height:100vh;flex-direction:column;}

/* ================= TOPBAR ================= */
.topbar{height:55px;background:#161b22;border-bottom:1px solid #30363d;display:flex;align-items:center;padding:0 15px;gap:15px;}
.logo{font-size:20px;font-weight:bold;}
.search{flex:1;}
.search input{width:100%;padding:10px;background:#0d1117;border:1px solid #30363d;color:white;border-radius:6px;}
.theme-btn{padding:8px 14px;border:none;background:#21262d;color:white;border-radius:6px;cursor:pointer;}

/* ================= MAIN ================= */
.container{flex:1;display:flex;overflow:hidden;}

/* ================= SIDEBAR ================= */
.sidebar{width:280px;min-width:180px;max-width:600px;background:#161b22;border-right:1px solid #30363d;overflow:auto;display:none;}
.file-item{padding:6px 12px;cursor:pointer;transition:0.2s;}
.file-item:hover{background:#21262d;}
.file-item.active{background:#30363d;}
.folder-item{padding:6px 12px;cursor:pointer;transition:0.2s;font-weight:bold;}
.folder-item:hover{background:#21262d;}

/* ================= RESIZER ================= */
.resizer{width:5px;background:#30363d;cursor:col-resize;transition:0.2s;display:none;}
.resizer:hover{background:#58a6ff;}

/* ================= CONTENT ================= */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;}
.file-header{height:55px;background:#161b22;border-bottom:1px solid #30363d;display:flex;justify-content:space-between;align-items:center;padding:0 20px;}
.file-actions{display:flex;gap:10px;}
.file-actions button{padding:8px 12px;border:none;background:#238636;color:white;border-radius:6px;cursor:pointer;}
.file-actions button:hover{background:#2ea043;}
.content{flex:1;overflow:auto;padding:20px;width:100%;}

/* ================= CODE ================= */
pre{font-size:14px;line-height:1.5;border-radius:7px;overflow:auto;}

/* ================= MARKDOWN ================= */
.markdown{max-width:1200px;line-height:1.8;}
.markdown h1{margin-bottom:10px;}
.markdown p{margin-bottom:20px;}

/* ================= LIGHT MODE ================= */
.light{background:#ffffff;color:#111;}
.light .topbar,.light .sidebar,.light .file-header,.light .login-box{background:#f5f5f5;color:#111;}
.light .search input,.light .login-box input{background:white;color:black;}
.light .file-item:hover,.light .folder-item:hover{background:#e5e5e5;}
.light .file-item.active{background:#dcdcdc;}

/* ================= MOBILE ================= */
@media(max-width:768px){
.sidebar{width:180px;}
.logo{display:none;}
.file-header{flex-direction:column;height:auto;padding:10px;gap:10px;}
}
</style>
</head>

<body>

<!-- ================= LOGIN ================= -->
<div id="loginPage">
    <div class="login-box">
        <h1>Mini GitHub</h1>
        <input type="password" id="password" placeholder="Password">
        <button onclick="login()">Login</button>
        <p id="error" style="color:red;margin-top:10px;"></p>
    </div>
</div>

<!-- ================= APP ================= -->
<div id="app">

    <!-- TOPBAR -->
    <div class="topbar">
        <div class="logo">Wang Qiang</div>
        <div class="search">
            <input type="text" id="searchInput" placeholder="Search file..." onkeyup="filterFiles()">
        </div>
        <button class="theme-btn" onclick="toggleTheme()">Theme</button>
    </div>

    <!-- MAIN -->
    <div class="container">

        <!-- SIDEBAR -->
        <div class="sidebar" id="fileList"></div>

        <!-- RESIZER -->
        <div class="resizer" id="resizer"></div>

        <!-- CONTENT -->
        <div class="main">
            <div class="file-header">
                <div id="currentFile">Repository Overview</div>
                <div class="file-actions">
                    <button onclick="showHome()">Home</button>
                    <button onclick="copyCode()">Copy</button>
                    <button onclick="downloadFile()">Download</button>
                </div>
            </div>
            <div class="content">
                <div id="viewer"></div>
            </div>
        </div>

    </div>
</div>

<!-- Prism -->
<script src="https://cdn.jsdelivr.net/npm/prismjs/prism.js"></script>
<script src="https://cdn.jsdelivr.net/npm/prismjs/components/prism-c.min.js"></script>

<!-- Markdown -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
