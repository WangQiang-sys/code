<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mini GitHub Viewer</title>

<link href="https://cdn.jsdelivr.net/npm/prismjs/themes/prism-tomorrow.css" rel="stylesheet"/>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#0d1117;
    color:#c9d1d9;
    font-family:Consolas, monospace;
    height:100vh;
    overflow:hidden;
}

/* ================= LOGIN ================= */

#loginPage{
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.login-box{
    width:320px;
    background:#161b22;
    padding:40px;
    border-radius:12px;
    box-shadow:0 0 20px rgba(0,0,0,0.5);
}

.login-box h1{
    text-align:center;
    margin-bottom:25px;
}

.login-box input{
    width:100%;
    padding:12px;
    margin-bottom:15px;
    border:none;
    outline:none;
    background:#0d1117;
    color:white;
    border:1px solid #30363d;
    border-radius:6px;
}

.login-box button{
    width:100%;
    padding:12px;
    border:none;
    background:#238636;
    color:white;
    border-radius:6px;
    cursor:pointer;
    font-size:16px;
}

.login-box button:hover{
    background:#2ea043;
}

/* ================= APP ================= */

#app{
    display:none;
    height:100vh;
    flex-direction:column;
}

/* ================= TOPBAR ================= */

.topbar{
    height:55px;
    background:#161b22;
    border-bottom:1px solid #30363d;
    display:flex;
    align-items:center;
    padding:0 12px;
    gap:12px;
}

.logo{
    font-size:20px;
    font-weight:bold;
}

/* 🔥 搜索框变短 */
.search{
    flex:0 0 200px;
}

.search input{
    width:100%;
    padding:8px;
    background:#0d1117;
    border:1px solid #30363d;
    color:white;
    border-radius:6px;
}

/* ================= TOOLBAR ================= */

.top-actions{
    display:flex;
    gap:8px;
    align-items:center;
    margin-left:auto;
}

/* 统一按钮 */
.theme-btn,
.action-btn{
    padding:7px 10px;
    border:none;
    background:#21262d;
    color:white;
    border-radius:6px;
    cursor:pointer;
    font-size:13px;
}

.theme-btn:hover,
.action-btn:hover{
    background:#30363d;
}

/* ================= MAIN ================= */

.container{
    flex:1;
    display:flex;
    overflow:hidden;
}

/* ================= SIDEBAR ================= */

.sidebar{
    width:280px;
    min-width:180px;
    max-width:600px;
    background:#161b22;
    border-right:1px solid #30363d;
    overflow:auto;
    display:none;
}

.file-item{
    padding:12px 15px;
    cursor:pointer;
    transition:0.2s;
}

.file-item:hover{
    background:#21262d;
}

.file-item.active{
    background:#30363d;
}

/* ================= RESIZER ================= */

.resizer{
    width:5px;
    background:#30363d;
    cursor:col-resize;
    display:none;
}

.resizer:hover{
    background:#58a6ff;
}

/* ================= CONTENT ================= */

.main{
    flex:1;
    display:flex;
    flex-direction:column;
    overflow:hidden;
}

.file-header{
    height:55px;
    background:#161b22;
    border-bottom:1px solid #30363d;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 20px;
}

.content{
    flex:1;
    overflow:auto;
    padding:20px;
}

/* ================= CODE ================= */

pre{
    font-size:14px;
    line-height:1.5;
    border-radius:7px;
    overflow:auto;
}

/* ================= LIGHT ================= */

.light{
    background:#ffffff;
    color:#111;
}

.light .topbar,
.light .sidebar,
.light .file-header,
.light .login-box{
    background:#f5f5f5;
    color:#111;
}

.light .search input{
    background:white;
    color:black;
}

</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginPage">
    <div class="login-box">
        <h1>Mini GitHub</h1>
        <input type="password" id="password" placeholder="Password">
        <button onclick="login()">Login</button>
        <p id="error" style="color:red;margin-top:10px;"></p>
    </div>
</div>

<!-- APP -->
<div id="app">

    <div class="topbar">

        <div class="logo">Wang Qiang</div>

        <div class="search">
            <input id="searchInput" placeholder="Search file..." onkeyup="filterFiles()">
        </div>

        <!-- 🔥 Theme + Buttons moved together -->
        <div class="top-actions">

            <button class="theme-btn" onclick="toggleTheme()">Theme</button>

            <button class="action-btn" onclick="showHomePage()">Home</button>

            <button class="action-btn" onclick="copyCode()">Copy</button>

            <button class="action-btn" onclick="downloadFile()">Download</button>

        </div>

    </div>

    <div class="container">

        <div class="sidebar">
            <div id="fileList"></div>
        </div>

        <div class="resizer" id="resizer"></div>

        <div class="main">

            <div class="file-header">
                <div id="currentFile">Repository Overview</div>
            </div>

            <div class="content">
                <div id="viewer"></div>
            </div>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/prismjs/prism.js"></script>
<script src="https://cdn.jsdelivr.net/npm/prismjs/components/prism-c.min.js"></script>

<script>

/* ================= CONFIG ================= */

const PASSWORD = "12345678";
const GITHUB_USER = "WangQiang-sys";
const REPO_NAME = "code";
const BRANCH = "main";

/* ================= FILES ================= */

const files = [
{
    name:"Calculated_Irradiation_Time.c",
    folder:"src",
    type:"C Source",
    modified:"2026-05-28",
    version:"v2.3"
},
{
    name:"test.h",
    folder:"include",
    type:"Header",
    modified:"2026-05-25",
    version:"v1.1"
}
];

/* ================= GLOBAL ================= */

let allFiles = [];
let currentText = "";
let currentRawUrl = "";

/* ================= LOGIN ================= */

function login(){

    const pwd = document.getElementById("password").value;

    if(pwd === PASSWORD){
        document.getElementById("loginPage").style.display = "none";
        document.getElementById("app").style.display = "flex";
        initFiles();
    }else{
        document.getElementById("error").innerText = "Wrong Password";
    }
}

/* ================= INIT ================= */

function initFiles(){

    allFiles = files.map(f => ({
        ...f,
        download_url:
`https://raw.githubusercontent.com/${GITHUB_USER}/${REPO_NAME}/${BRANCH}/${f.name}`
    }));

    renderFiles(allFiles);
    showHomePage();
}

/* ================= RENDER ================= */

function renderFiles(list){

    const box = document.getElementById("fileList");
    box.innerHTML = "";

    list.forEach(file => {

        const div = document.createElement("div");
        div.className = "file-item";
        div.innerText = "📄 " + file.name;

        div.onclick = () => openFile(file);

        box.appendChild(div);
    });
}

/* ================= HOME ================= */

function showHomePage(){

    document.querySelector(".sidebar").style.display = "none";
    document.querySelector(".resizer").style.display = "none";

    document.getElementById("currentFile").innerText =
        "Repository Overview";

    document.getElementById("viewer").innerHTML = `
        <h2>Repository</h2>
        <p>Select a file to view</p>
    `;
}

/* ================= OPEN FILE ================= */

async function openFile(file){

    document.querySelector(".sidebar").style.display = "block";
    document.querySelector(".resizer").style.display = "block";

    document.getElementById("currentFile").innerText = file.name;

    currentRawUrl = file.download_url;

    const res = await fetch(file.download_url);
    const text = await res.text();

    currentText = text;

    document.getElementById("viewer").innerHTML = `
        <pre><code class="language-c">${escapeHtml(text)}</code></pre>
    `;

    Prism.highlightAll();
}

/* ================= UTILS ================= */

function escapeHtml(t){
    return t.replace(/&/g,"&amp;")
            .replace(/</g,"&lt;")
            .replace(/>/g,"&gt;");
}

/* ================= ACTIONS ================= */

function copyCode(){
    if(!currentText) return alert("No file");
    navigator.clipboard.writeText(currentText);
    alert("Copied");
}

function downloadFile(){
    if(!currentRawUrl) return alert("No file");

    fetch(currentRawUrl)
    .then(r=>r.blob())
    .then(b=>{
        const url = URL.createObjectURL(b);
        const a = document.createElement("a");
        a.href = url;
        a.download = document.getElementById("currentFile").innerText;
        a.click();
    });
}

/* ================= THEME ================= */

function toggleTheme(){
    document.body.classList.toggle("light");
}

</script>

</body>
</html>
