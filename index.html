<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mini GitHub Viewer</title>

<link href="https://cdn.jsdelivr.net/npm/prismjs/themes/prism-tomorrow.css" rel="stylesheet"/>

<style>

/* ================== 原CSS（未改动） ================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#0d1117;
    color:#c9d1d9;
    font-family:Consolas, monospace;
    height:100vh;
    overflow:hidden;
}

/* LOGIN */
#loginPage{
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.login-box{
    width:320px;
    background:#161b22;
    padding:40px;
    border-radius:12px;
    box-shadow:0 0 20px rgba(0,0,0,0.5);
}

.login-box input{
    width:100%;
    padding:12px;
    margin-bottom:15px;
    background:#0d1117;
    color:white;
    border:1px solid #30363d;
    border-radius:6px;
}

.login-box button{
    width:100%;
    padding:12px;
    background:#238636;
    color:white;
    border:none;
    border-radius:6px;
    cursor:pointer;
}

/* APP */
#app{
    display:none;
    height:100vh;
    flex-direction:column;
}

/* TOPBAR */
.topbar{
    height:55px;
    background:#161b22;
    border-bottom:1px solid #30363d;
    display:flex;
    align-items:center;
    padding:0 15px;
    gap:15px;
}

.logo{
    font-size:20px;
    font-weight:bold;
}

.search{
    flex:1;
}

.search input{
    width:100%;
    padding:10px;
    background:#0d1117;
    border:1px solid #30363d;
    color:white;
    border-radius:6px;
}

.theme-btn{
    padding:8px 14px;
    background:#21262d;
    color:white;
    border:none;
    border-radius:6px;
    cursor:pointer;
}

/* MAIN */
.container{
    flex:1;
    display:flex;
    overflow:hidden;
}

/* SIDEBAR */
.sidebar{
    width:280px;
    background:#161b22;
    border-right:1px solid #30363d;
    overflow:auto;
}

.file-item{
    padding:10px 12px;
    cursor:pointer;
}

.file-item:hover{
    background:#21262d;
}

.file-item.active{
    background:#30363d;
}

/* RESIZER */
.resizer{
    width:5px;
    background:#30363d;
    cursor:col-resize;
}

/* CONTENT */
.main{
    flex:1;
    overflow:auto;
    padding:20px;
}

pre{
    background:#0d1117;
    padding:15px;
    border-radius:6px;
    overflow:auto;
}

.markdown{
    max-width:1200px;
}

</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginPage">
    <div class="login-box">
        <h1>Mini GitHub</h1>
        <input type="password" id="password" placeholder="Password">
        <button onclick="login()">Login</button>
        <p id="error" style="color:red;"></p>
    </div>
</div>

<!-- APP -->
<div id="app">

    <div class="topbar">
        <div class="logo">Wang Qiang</div>

        <div class="search">
            <input type="text" id="searchInput" onkeyup="filterFiles()" placeholder="Search file...">
        </div>

        <button class="theme-btn" onclick="toggleTheme()">Theme</button>
    </div>

    <div class="container">

        <div class="sidebar" id="fileList"></div>

        <div class="resizer" id="resizer"></div>

        <div class="main">
            <div id="viewer"></div>
        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/prismjs/prism.js"></script>
<script src="https://cdn.jsdelivr.net/npm/prismjs/components/prism-c.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<script>

/* ================= CONFIG ================= */
const PASSWORD = "12345678";
const GITHUB_USER = "WangQiang-sys";
const REPO_NAME = "code";
const BRANCH = "main";

/* ================= FILES ================= */
const files = [
{
    name:"Calculated_Irradiation_Time.c",
    folder:"src",
    type:"C Source"
},
{
    name:"physics.c",
    folder:"src",
    type:"C Source"
},
{
    name:"test.h",
    folder:"include",
    type:"Header"
},
{
    name:"main.c",
    folder:"",
    type:"C Source"
}
];

/* ================= GLOBAL ================= */
let allFiles = [];
let folderState = {};
let currentText = "";
let currentRawUrl = "";

/* ================= LOGIN ================= */
function login(){

    const pwd = document.getElementById("password").value;

    if(pwd === PASSWORD){
        document.getElementById("loginPage").style.display = "none";
        document.getElementById("app").style.display = "flex";
        initFiles();
    }else{
        document.getElementById("error").innerText = "Wrong Password";
    }
}

/* ================= INIT ================= */
function initFiles(){

    allFiles = files.map(file => ({

        ...file,

        folder: file.folder || "root",

        download_url:
`https://raw.githubusercontent.com/${GITHUB_USER}/${REPO_NAME}/${BRANCH}/${file.folder ? file.folder + "/" : ""}${file.name}`

    }));

    renderFiles(allFiles);
}

/* ================= FILE TREE（已改：折叠版） ================= */
function renderFiles(files){

    const list = document.getElementById("fileList");
    list.innerHTML = "";

    const groups = {};

    files.forEach(file => {

        const folder = file.folder || "root";

        if(!groups[folder]){
            groups[folder] = [];
        }

        groups[folder].push(file);
    });

    Object.keys(groups).forEach(folder => {

        if(folderState[folder] === undefined){
            folderState[folder] = false;
        }

        const folderDiv = document.createElement("div");
        folderDiv.className = "file-item";

        const icon = folderState[folder] ? "📂" : "📁";

        folderDiv.innerHTML = `${icon} ${folder}`;

        folderDiv.onclick = () => {

            folderState[folder] = !folderState[folder];

            renderFiles(allFiles);
        };

        list.appendChild(folderDiv);

        if(folderState[folder]){

            groups[folder].forEach(file => {

                const div = document.createElement("div");
                div.className = "file-item";
                div.style.paddingLeft = "28px";

                div.innerHTML = `📄 ${file.name}`;

                div.onclick = async () => {

                    document.querySelectorAll(".file-item")
                        .forEach(x => x.classList.remove("active"));

                    div.classList.add("active");

                    const res = await fetch(file.download_url);
                    const text = await res.text();

                    currentText = text;
                    currentRawUrl = file.download_url;

                    if(file.name.endsWith(".md")){

                        document.getElementById("viewer").innerHTML =
                            marked.parse(text);

                    }else{

                        document.getElementById("viewer").innerHTML =
`
<pre><code class="language-c">${escapeHtml(text)}</code></pre>
`;

                        Prism.highlightAll();
                    }
                };

                list.appendChild(div);
            });
        }
    });
}

/* ================= UTIL ================= */
function escapeHtml(text){
    return text.replace(/&/g,"&amp;")
               .replace(/</g,"&lt;")
               .replace(/>/g,"&gt;");
}

/* ================= SEARCH ================= */
function filterFiles(){

    const key = document.getElementById("searchInput").value.toLowerCase();

    const filtered = allFiles.filter(f =>
        f.name.toLowerCase().includes(key)
    );

    renderFiles(filtered);
}

/* ================= THEME ================= */
function toggleTheme(){
    document.body.classList.toggle("light");
}

/* ================= RESIZER ================= */
const resizer = document.getElementById("resizer");
const sidebar = document.querySelector(".sidebar");

let isResizing = false;

resizer.addEventListener("mousedown", () => {
    isResizing = true;
});

document.addEventListener("mousemove", (e) => {
    if(!isResizing) return;

    let w = e.clientX;
    if(w < 120) w = 120;
    if(w > 600) w = 600;

    sidebar.style.width = w + "px";
});

document.addEventListener("mouseup", () => {
    isResizing = false;
});

</script>

</body>
</html>
