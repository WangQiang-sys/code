<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mini GitHub Pro</title>

<!-- Prism -->
<link href="https://cdn.jsdelivr.net/npm/prismjs/themes/prism-tomorrow.css" rel="stylesheet"/>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#0d1117;
    color:#c9d1d9;
    font-family:Consolas, monospace;
    height:100vh;
    overflow:hidden;
}

/* ================= LOGIN ================= */

#loginPage{
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.login-box{
    width:320px;
    background:#161b22;
    padding:40px;
    border-radius:12px;
    box-shadow:0 0 20px rgba(0,0,0,0.5);
}

.login-box h1{
    text-align:center;
    margin-bottom:25px;
}

.login-box input{
    width:100%;
    padding:12px;
    margin-bottom:15px;
    border:none;
    outline:none;
    background:#0d1117;
    color:white;
    border:1px solid #30363d;
    border-radius:6px;
}

.login-box button{
    width:100%;
    padding:12px;
    border:none;
    background:#238636;
    color:white;
    border-radius:6px;
    cursor:pointer;
    font-size:16px;
}

.login-box button:hover{
    background:#2ea043;
}

/* ================= APP ================= */

#app{
    display:none;
    height:100vh;
    flex-direction:column;
}

/* ================= TOPBAR ================= */

.topbar{
    height:55px;
    background:#161b22;
    border-bottom:1px solid #30363d;
    display:flex;
    align-items:center;
    gap:15px;
    padding:0 15px;
}

.logo{
    font-size:20px;
    font-weight:bold;
}

.search{
    flex:1;
}

.search input{
    width:100%;
    padding:10px;
    background:#0d1117;
    border:1px solid #30363d;
    color:white;
    border-radius:6px;
}

.theme-btn{
    padding:8px 14px;
    border:none;
    background:#21262d;
    color:white;
    border-radius:6px;
    cursor:pointer;
}

/* ================= MAIN ================= */

.container{
    flex:1;
    display:flex;
    overflow:hidden;
}

/* ================= SIDEBAR ================= */

.sidebar{
    width:300px;
    min-width:180px;
    max-width:700px;
    background:#161b22;
    border-right:1px solid #30363d;
    overflow:auto;
}

.file-item{
    padding:10px 15px;
    border-bottom:1px solid #21262d;
    cursor:pointer;
    transition:0.2s;
}

.file-item:hover{
    background:#21262d;
}

.file-item.active{
    background:#30363d;
}

.file-name{
    font-size:12px;
}

.file-info{
    margin-top:5px;
    display:flex;
    justify-content:space-between;
    color:#8b949e;
    font-size:10px;
}

/* ================= RESIZER ================= */

.resizer{
    width:5px;
    background:#30363d;
    cursor:col-resize;
}

.resizer:hover{
    background:#58a6ff;
}

/* ================= MAIN ================= */

.main{
    flex:1;
    display:flex;
    flex-direction:column;
    overflow:hidden;
}

.file-header{
    height:60px;
    background:#161b22;
    border-bottom:1px solid #30363d;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 20px;
}

.file-title{
    display:flex;
    flex-direction:column;
    gap:3px;
}

.file-title small{
    color:#8b949e;
    font-size:11px;
}

.file-actions{
    display:flex;
    gap:10px;
}

.file-actions button{
    padding:8px 12px;
    border:none;
    background:#238636;
    color:white;
    border-radius:6px;
    cursor:pointer;
}

.content{
    flex:1;
    overflow:auto;
    padding:20px;
}

/* ================= CODE ================= */

pre{
    font-size:6px;
    line-height:1.0;
    border-radius:8px;
}

/* ================= EDITOR ================= */

#editor{
    width:100%;
    height:100%;
    background:#0d1117;
    color:#c9d1d9;
    border:none;
    outline:none;
    resize:none;
    font-family:Consolas, monospace;
    font-size:11px;
    line-height:1.4;
}

/* ================= HISTORY ================= */

.history-box{
    margin-top:20px;
    border-top:1px solid #30363d;
    padding-top:15px;
}

.commit-item{
    padding:10px;
    border-bottom:1px solid #21262d;
    font-size:11px;
}

.commit-date{
    color:#8b949e;
    margin-top:4px;
}

/* ================= MARKDOWN ================= */

.markdown{
    max-width:1000px;
    line-height:1.8;
}

/* ================= LIGHT ================= */

.light{
    background:white;
    color:black;
}

.light .topbar,
.light .sidebar,
.light .file-header,
.light .login-box{
    background:#f5f5f5;
    color:black;
}

.light .search input,
.light .login-box input{
    background:white;
    color:black;
}

.light #editor{
    background:white;
    color:black;
}

/* ================= MOBILE ================= */

@media(max-width:768px){

    .sidebar{
        width:180px;
    }

    .logo{
        display:none;
    }

    .file-header{
        flex-direction:column;
        height:auto;
        padding:10px;
        gap:10px;
    }
}

</style>
</head>

<body>

<!-- LOGIN -->

<div id="loginPage">

    <div class="login-box">

        <h1>Mini GitHub</h1>

        <input type="password" id="password" placeholder="Password">

        <button onclick="login()">Login</button>

        <p id="error" style="color:red;margin-top:10px;"></p>

    </div>

</div>

<!-- APP -->

<div id="app">

    <!-- TOP -->

    <div class="topbar">

        <div class="logo">Mini GitHub Pro</div>

        <div class="search">

            <input
                type="text"
                id="searchInput"
                placeholder="Search..."
                onkeyup="filterFiles()"
            >

        </div>

        <button class="theme-btn" onclick="toggleTheme()">
            Theme
        </button>

    </div>

    <!-- MAIN -->

    <div class="container">

        <!-- SIDEBAR -->

        <div class="sidebar">

            <div id="fileList"></div>

        </div>

        <!-- RESIZER -->

        <div class="resizer" id="resizer"></div>

        <!-- CONTENT -->

        <div class="main">

            <div class="file-header">

                <div class="file-title">

                    <div id="currentFile">
                        No file selected
                    </div>

                    <small id="lastUpdate">
                        -
                    </small>

                </div>

                <div class="file-actions">

                    <button onclick="copyCode()">
                        Copy
                    </button>

                    <button onclick="downloadFile()">
                        Download
                    </button>

                    <button onclick="toggleEdit()">
                        Edit
                    </button>

                </div>

            </div>

            <div class="content">

                <div id="viewer">

                    <div style="
                        padding:40px;
                        color:#8b949e;
                    ">
                        Select a file to view
                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

<!-- Prism -->

<script src="https://cdn.jsdelivr.net/npm/prismjs/prism.js"></script>
<script src="https://cdn.jsdelivr.net/npm/prismjs/components/prism-c.min.js"></script>

<!-- Markdown -->

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<script>

/* ================= CONFIG ================= */

const PASSWORD = "12345678";

const GITHUB_USER = "WangQiang-sys";

const REPO_NAME = "code";

const BRANCH = "main";

/* ================= GLOBAL ================= */

let allFiles = [];

let currentText = "";

let currentRawUrl = "";

let currentFilePath = "";

let isEditing = false;

/* ================= LOGIN ================= */

function login(){

    const pwd =
        document.getElementById("password").value;

    if(pwd === PASSWORD){

        document.getElementById("loginPage")
            .style.display = "none";

        document.getElementById("app")
            .style.display = "flex";

        loadFiles();

    }else{

        document.getElementById("error")
            .innerText = "Wrong Password";
    }
}

/* ================= LOAD FILES ================= */

async function loadFiles(){

    const url =

`https://api.github.com/repos/${GITHUB_USER}/${REPO_NAME}/contents/`;

    const response = await fetch(url);

    const data = await response.json();

    allFiles = data.filter(x => x.type === "file");

    renderFiles(allFiles);
}

/* ================= FILE ICON ================= */

function getIcon(name){

    if(name.endsWith(".c")) return "🟦";
    if(name.endsWith(".h")) return "🟨";
    if(name.endsWith(".md")) return "🟩";
    if(name.endsWith(".txt")) return "📄";

    return "📁";
}

/* ================= RENDER FILES ================= */

function renderFiles(files){

    const list =
        document.getElementById("fileList");

    list.innerHTML = "";

    files.forEach(file => {

        const div =
            document.createElement("div");

        div.className = "file-item";

        const ext =
            file.name.split(".").pop().toUpperCase();

        div.innerHTML = `

<div class="file-name">
${getIcon(file.name)} ${file.name}
</div>

<div class="file-info">

<span>${ext}</span>

<span>${(file.size/1024).toFixed(1)} KB</span>

</div>

`;

        div.onclick = () => {

            document.querySelectorAll(".file-item")
                .forEach(x => x.classList.remove("active"));

            div.classList.add("active");

            openFile(file);
        };

        list.appendChild(div);
    });
}

/* ================= SEARCH ================= */

function filterFiles(){

    const key =
        document.getElementById("searchInput")
        .value
        .toLowerCase();

    const filtered =
        allFiles.filter(f =>
            f.name.toLowerCase().includes(key)
        );

    renderFiles(filtered);
}

/* ================= OPEN FILE ================= */

async function openFile(file){

    currentFilePath = file.path;

    currentRawUrl = file.download_url;

    document.getElementById("currentFile")
        .innerText = file.name;

    try{

        const response =
            await fetch(file.download_url);

        const text =
            await response.text();

        currentText = text;

        renderCode(file.name, text);

        loadHistory(file.path);

    }catch(err){

        document.getElementById("viewer")
            .innerHTML =
            "<h2>Load Failed</h2>";
    }
}

/* ================= RENDER CODE ================= */

function renderCode(filename, text){

    const viewer =
        document.getElementById("viewer");

    if(filename.endsWith(".md")){

        viewer.innerHTML = `

<div class="markdown">
${marked.parse(text)}
</div>

`;
    }

    else{

        viewer.innerHTML = `

<pre>
<code class="language-c">
${escapeHtml(text)}
</code>
</pre>

`;

        Prism.highlightAll();
    }
}

/* ================= HISTORY ================= */

async function loadHistory(path){

    const url =

`https://api.github.com/repos/${GITHUB_USER}/${REPO_NAME}/commits?path=${path}`;

    try{

        const response = await fetch(url);

        const commits = await response.json();

        if(commits.length > 0){

            const latest = commits[0];

            document.getElementById("lastUpdate")
                .innerText =

`Last Update: ${latest.commit.author.date}`;

            let html = `

<div class="history-box">

<h3 style="margin-bottom:10px;">
History
</h3>

`;

            commits.slice(0,5).forEach(c => {

                html += `

<div class="commit-item">

<div>
${c.commit.message}
</div>

<div class="commit-date">
${c.commit.author.date}
</div>

</div>

`;
            });

            html += `</div>`;

            document.getElementById("viewer")
                .innerHTML += html;
        }

    }catch(err){

        console.log(err);
    }
}

/* ================= EDIT ================= */

function toggleEdit(){

    if(!currentText) return;

    const viewer =
        document.getElementById("viewer");

    if(!isEditing){

        viewer.innerHTML = `

<textarea id="editor">
${currentText}
</textarea>

`;

        isEditing = true;
    }

    else{

        currentText =
            document.getElementById("editor").value;

        renderCode(currentFilePath, currentText);

        isEditing = false;
    }
}

/* ================= ESCAPE ================= */

function escapeHtml(text){

    return text
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;");
}

/* ================= COPY ================= */

function copyCode(){

    navigator.clipboard.writeText(currentText);

    alert("Copied!");
}

/* ================= DOWNLOAD ================= */

function downloadFile(){

    if(!currentRawUrl) return;

    fetch(currentRawUrl)
        .then(response => response.blob())
        .then(blob => {

            const blobUrl =
                window.URL.createObjectURL(blob);

            const a =
                document.createElement("a");

            a.href = blobUrl;

            a.download =
                document.getElementById("currentFile")
                .innerText;

            document.body.appendChild(a);

            a.click();

            a.remove();

            window.URL.revokeObjectURL(blobUrl);
        });
}

/* ================= THEME ================= */

function toggleTheme(){

    document.body.classList.toggle("light");
}

/* ================= RESIZE ================= */

const resizer =
    document.getElementById("resizer");

const sidebar =
    document.querySelector(".sidebar");

let isResizing = false;

resizer.addEventListener("mousedown", () => {

    isResizing = true;

    document.body.style.cursor = "col-resize";
});

document.addEventListener("mousemove", (e) => {

    if(!isResizing) return;

    let width = e.clientX;

    if(width < 100) width = 100;

    if(width > 900) width = 900;

    sidebar.style.width = width + "px";
});

document.addEventListener("mouseup", () => {

    isResizing = false;

    document.body.style.cursor = "default";
});

</script>

</body>
</html>
