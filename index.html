<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mini GitHub C Viewer</title>

<!-- Prism.js -->
<link href="https://cdn.jsdelivr.net/npm/prismjs/themes/prism-tomorrow.css" rel="stylesheet"/>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#0d1117;
    color:#c9d1d9;
    font-family:Consolas, monospace;
    height:100vh;
    overflow:hidden;
}

/* ================= LOGIN ================= */

#loginPage{
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.login-box{
    width:320px;
    background:#161b22;
    padding:40px;
    border-radius:12px;
    box-shadow:0 0 20px rgba(0,0,0,0.5);
}

.login-box h1{
    text-align:center;
    margin-bottom:25px;
}

.login-box input{
    width:100%;
    padding:12px;
    margin-bottom:15px;
    border:none;
    outline:none;
    background:#0d1117;
    color:white;
    border:1px solid #30363d;
    border-radius:6px;
}

.login-box button{
    width:100%;
    padding:12px;
    border:none;
    background:#238636;
    color:white;
    border-radius:6px;
    cursor:pointer;
    font-size:16px;
}

.login-box button:hover{
    background:#2ea043;
}

/* ================= APP ================= */

#app{
    display:none;
    height:100vh;
    flex-direction:column;
}

/* ================= TOPBAR ================= */

.topbar{
    height:55px;
    background:#161b22;
    border-bottom:1px solid #30363d;
    display:flex;
    align-items:center;
    padding:0 15px;
    gap:15px;
}

.logo{
    font-size:20px;
    font-weight:bold;
}

.search{
    flex:1;
}

.search input{
    width:100%;
    padding:10px;
    background:#0d1117;
    border:1px solid #30363d;
    color:white;
    border-radius:6px;
}

.theme-btn{
    padding:8px 14px;
    border:none;
    background:#21262d;
    color:white;
    border-radius:6px;
    cursor:pointer;
}

/* ================= MAIN ================= */

.container{
    flex:1;
    display:flex;
    overflow:hidden;
}

/* ================= SIDEBAR ================= */

.sidebar{
    width:280px;
    min-width:180px;
    max-width:600px;
    background:#161b22;
    border-right:1px solid #30363d;
    overflow:auto;
}

.file-item{
    padding:12px 15px;
    border-bottom:1px solid #21262d;
    cursor:pointer;
    transition:0.2s;
}

.file-item:hover{
    background:#21262d;
}

.file-item.active{
    background:#30363d;
}

/* ================= RESIZER ================= */

.resizer{
    width:5px;
    background:#30363d;
    cursor:col-resize;
    transition:0.2s;
}

.resizer:hover{
    background:#58a6ff;
}

/* ================= CONTENT ================= */

.main{
    flex:1;
    display:flex;
    flex-direction:column;
    overflow:hidden;
}

.file-header{
    height:55px;
    background:#161b22;
    border-bottom:1px solid #30363d;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 20px;
}

.file-actions{
    display:flex;
    gap:10px;
}

.file-actions button{
    padding:8px 12px;
    border:none;
    background:#238636;
    color:white;
    border-radius:6px;
    cursor:pointer;
}

.content{
    flex:1;
    overflow:auto;
    padding:20px;
}

/* ================= CODE ================= */

pre{
    font-size:8px;
    line-height:1.0;
    border-radius:7px;
}

/* ================= MARKDOWN ================= */

.markdown{
    max-width:1000px;
    line-height:1.8;
}

.markdown h1,
.markdown h2,
.markdown h3{
    margin-top:20px;
    margin-bottom:10px;
}

.markdown p{
    margin:10px 0;
}

.markdown code{
    background:#21262d;
    padding:2px 6px;
    border-radius:4px;
}

/* ================= LIGHT MODE ================= */

.light{
    background:#ffffff;
    color:#111;
}

.light .topbar,
.light .sidebar,
.light .file-header,
.light .login-box{
    background:#f5f5f5;
    color:#111;
}

.light .search input,
.light .login-box input{
    background:white;
    color:black;
}

.light .file-item:hover{
    background:#e5e5e5;
}

.light .file-item.active{
    background:#dcdcdc;
}

/* ================= MOBILE ================= */

@media(max-width:768px){

    .sidebar{
        width:180px;
    }

    .logo{
        display:none;
    }

    .file-header{
        flex-direction:column;
        height:auto;
        padding:10px;
        gap:10px;
    }
}

</style>
</head>

<body>

<!-- ================= LOGIN ================= -->

<div id="loginPage">

    <div class="login-box">

        <h1>Mini GitHub</h1>

        <input type="password" id="password" placeholder="Password">

        <button onclick="login()">Login</button>

        <p id="error" style="color:red;margin-top:10px;"></p>

    </div>

</div>

<!-- ================= APP ================= -->

<div id="app">

    <!-- top -->

    <div class="topbar">

        <div class="logo">Mini GitHub</div>

        <div class="search">
            <input
                type="text"
                id="searchInput"
                placeholder="Search file..."
                onkeyup="filterFiles()"
            >
        </div>

        <button class="theme-btn" onclick="toggleTheme()">
            Theme
        </button>

    </div>

    <!-- main -->

    <div class="container">

        <!-- sidebar -->

        <div class="sidebar">

            <div id="fileList"></div>

        </div>

        <!-- resizer -->

        <div class="resizer" id="resizer"></div>

        <!-- content -->

        <div class="main">

            <div class="file-header">

                <div id="currentFile">
                    No file selected
                </div>

                <div class="file-actions">

                    <button onclick="copyCode()">
                        Copy
                    </button>

                    <button onclick="downloadFile()">
                        Download
                    </button>

                </div>

            </div>

            <div class="content">

                <div id="viewer"></div>

            </div>

        </div>

    </div>

</div>

<!-- Prism -->
<script src="https://cdn.jsdelivr.net/npm/prismjs/prism.js"></script>
<script src="https://cdn.jsdelivr.net/npm/prismjs/components/prism-c.min.js"></script>

<!-- Markdown -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<script>

/* ================= CONFIG ================= */

const PASSWORD = "12345678";

const GITHUB_USER = "WangQiang-sys";

const REPO_NAME = "code";

const BRANCH = "main";

/* ================= FILES ================= */

const files = [

    "Calculated_Irradiation_Time.c",

    "test.h"

];

/* ================= GLOBAL ================= */

let allFiles = [];

let currentText = "";

let currentRawUrl = "";

/* ================= LOGIN ================= */

function login(){

    const pwd =
        document.getElementById("password").value;

    if(pwd === PASSWORD){

        document.getElementById("loginPage")
            .style.display = "none";

        document.getElementById("app")
            .style.display = "flex";

        initFiles();

    }else{

        document.getElementById("error")
            .innerText = "Wrong Password";
    }
}

/* ================= INIT FILES ================= */

function initFiles(){

    allFiles = files.map(name => ({

        name: name,

        download_url:
`https://raw.githubusercontent.com/${GITHUB_USER}/${REPO_NAME}/${BRANCH}/${name}`

    }));

    renderFiles(allFiles);

    // 自动打开第一个文件
    if(allFiles.length > 0){

        openFile(allFiles[0]);
    }
}

/* ================= RENDER FILES ================= */

function renderFiles(files){

    const list =
        document.getElementById("fileList");

    list.innerHTML = "";

    files.forEach(file => {

        const div =
            document.createElement("div");

        div.className = "file-item";

        div.innerText = file.name;

        div.onclick = () => {

            document.querySelectorAll(".file-item")
                .forEach(x => x.classList.remove("active"));

            div.classList.add("active");

            openFile(file);
        };

        list.appendChild(div);
    });
}

/* ================= SEARCH ================= */

function filterFiles(){

    const key =
        document.getElementById("searchInput")
        .value
        .toLowerCase();

    const filtered =
        allFiles.filter(f =>
            f.name.toLowerCase().includes(key)
        );

    renderFiles(filtered);
}

/* ================= OPEN FILE ================= */

async function openFile(file){

    document.getElementById("currentFile")
        .innerText = file.name;

    currentRawUrl = file.download_url;

    try{

        const response =
            await fetch(file.download_url);

        const text =
            await response.text();

        currentText = text;

        const viewer =
            document.getElementById("viewer");

        /* markdown */

        if(file.name.toLowerCase().endsWith(".md")){

            viewer.innerHTML =
                `<div class="markdown">${marked.parse(text)}</div>`;
        }

        /* c/h */

        else{

            viewer.innerHTML =

`<pre><code class="language-c">${escapeHtml(text)}</code></pre>`;

            Prism.highlightAll();
        }

    }catch(err){

        document.getElementById("viewer")
            .innerHTML =
            "<h2>Load Failed</h2>";
    }
}

/* ================= ESCAPE HTML ================= */

function escapeHtml(text){

    return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
}

/* ================= COPY ================= */

function copyCode(){

    navigator.clipboard.writeText(currentText);

    alert("Copied!");
}

/* ================= DOWNLOAD ================= */

function downloadFile(){

    if(!currentRawUrl) return;

    fetch(currentRawUrl)
        .then(response => response.blob())
        .then(blob => {

            const blobUrl =
                window.URL.createObjectURL(blob);

            const a =
                document.createElement("a");

            a.href = blobUrl;

            a.download =
                document.getElementById("currentFile")
                .innerText;

            document.body.appendChild(a);

            a.click();

            a.remove();

            window.URL.revokeObjectURL(blobUrl);
        });
}

/* ================= THEME ================= */

function toggleTheme(){

    document.body.classList.toggle("light");
}

/* ================= RESIZE ================= */

const resizer =
    document.getElementById("resizer");

const sidebar =
    document.querySelector(".sidebar");

let isResizing = false;

resizer.addEventListener("mousedown", () => {

    isResizing = true;

    document.body.style.cursor = "col-resize";
});

document.addEventListener("mousemove", (e) => {

    if(!isResizing) return;

    let width = e.clientX;

    if(width < 100) width = 100;

    if(width > 900) width = 900;

    sidebar.style.width = width + "px";
});

document.addEventListener("mouseup", () => {

    isResizing = false;

    document.body.style.cursor = "default";
});

</script>

</body>
</html>
