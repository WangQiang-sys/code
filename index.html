<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mini GitHub Viewer</title>

<link href="https://cdn.jsdelivr.net/npm/prismjs/themes/prism-tomorrow.css" rel="stylesheet"/>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#0d1117;
    color:#c9d1d9;
    font-family:Consolas, monospace;
    height:100vh;
    overflow:hidden;
}

#loginPage{
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.login-box{
    width:320px;
    background:#161b22;
    padding:40px;
    border-radius:12px;
    box-shadow:0 0 20px rgba(0,0,0,0.5);
}

.login-box input{
    width:100%;
    padding:12px;
    margin-bottom:15px;
    background:#0d1117;
    color:white;
    border:1px solid #30363d;
    border-radius:6px;
}

.login-box button{
    width:100%;
    padding:12px;
    background:#238636;
    color:white;
    border:none;
    border-radius:6px;
    cursor:pointer;
}

#app{
    display:none;
    height:100vh;
    flex-direction:column;
}

.topbar{
    height:55px;
    background:#161b22;
    border-bottom:1px solid #30363d;
    display:flex;
    align-items:center;
    padding:0 15px;
}

.logo{
    font-size:18px;
    font-weight:bold;
}

.container{
    flex:1;
    display:flex;
    overflow:hidden;
}

.sidebar{
    width:280px;
    background:#161b22;
    border-right:1px solid #30363d;
    overflow:auto;
}

.file-item{
    padding:10px 12px;
    cursor:pointer;
}

.file-item:hover{
    background:#21262d;
}

.file-item.active{
    background:#30363d;
}

.main{
    flex:1;
    padding:20px;
    overflow:auto;
}

pre{
    background:#0d1117;
    padding:15px;
    border-radius:6px;
    overflow:auto;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginPage">
    <div class="login-box">
        <h2>Mini GitHub</h2>
        <input type="password" id="password" placeholder="Password">
        <button onclick="login()">Login</button>
        <p id="error" style="color:red;"></p>
    </div>
</div>

<!-- APP -->
<div id="app">

    <div class="topbar">
        <div class="logo">Mini GitHub Viewer</div>
    </div>

    <div class="container">

        <div class="sidebar" id="fileList"></div>

        <div class="main">
            <div id="viewer">Select a file</div>
        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/prismjs/prism.js"></script>
<script src="https://cdn.jsdelivr.net/npm/prismjs/components/prism-c.min.js"></script>

<script>

/* ===== CONFIG ===== */
const PASSWORD = "12345678";
const GITHUB_USER = "WangQiang-sys";
const REPO_NAME = "code";
const BRANCH = "main";

/* ===== FILES ===== */
const files = [
{
    name:"Calculated_Irradiation_Time.c",
    folder:"",
    type:"C Source"
},
{
    name:"r.c",
    folder:"HPGe",
    type:"C Source"
}
];

/* ===== GLOBAL ===== */
let allFiles = [];
let folderState = {};
let currentText = "";
let currentRawUrl = "";

/* ===== LOGIN ===== */
function login(){

    const pwd = document.getElementById("password").value;

    if(pwd === PASSWORD){
        document.getElementById("loginPage").style.display = "none";
        document.getElementById("app").style.display = "flex";
        initFiles();
    }else{
        document.getElementById("error").innerText = "Wrong Password";
    }
}

/* ===== INIT ===== */
function initFiles(){

    allFiles = files.map(file => ({

        ...file,
        folder: file.folder || "root",
        download_url:
`https://raw.githubusercontent.com/${GITHUB_USER}/${REPO_NAME}/${BRANCH}/${file.folder ? file.folder + "/" : ""}${file.name}`

    }));

    renderFiles(allFiles);
}

/* ===== RENDER TREE ===== */
function renderFiles(files){

    const list = document.getElementById("fileList");
    list.innerHTML = "";

    const groups = {};

    files.forEach(file => {

        const folder = file.folder || "root";

        if(!groups[folder]){
            groups[folder] = [];
        }

        groups[folder].push(file);
    });

    Object.keys(groups).forEach(folder => {

        if(folderState[folder] === undefined){
            folderState[folder] = false;
        }

        const folderDiv = document.createElement("div");

        folderDiv.className = "file-item";

        const icon = folderState[folder] ? "📂" : "📁";

        folderDiv.innerHTML = `${icon} ${folder}`;

        folderDiv.onclick = () => {
            folderState[folder] = !folderState[folder];
            renderFiles(allFiles);
        };

        list.appendChild(folderDiv);

        if(folderState[folder]){

            groups[folder].forEach(file => {

                const div = document.createElement("div");

                div.className = "file-item";
                div.style.paddingLeft = "30px";

                div.innerHTML = `📄 ${file.name}`;

                div.onclick = async () => {

                    const res = await fetch(file.download_url);
                    const text = await res.text();

                    currentText = text;
                    currentRawUrl = file.download_url;

                    document.getElementById("viewer").innerHTML =
`
<pre><code class="language-c">${escapeHtml(text)}</code></pre>
`;

                    Prism.highlightAll();
                };

                list.appendChild(div);
            });
        }
    });
}

/* ===== ESCAPE ===== */
function escapeHtml(text){
    return text
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;");
}

</script>

</body>
</html>
