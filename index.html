<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>C Files Viewer</title>

<style>
    body{
        font-family: Arial, sans-serif;
        margin:0;
        background:#f5f5f5;
    }

    .login-box,
    .main-box{
        width:90%;
        max-width:1000px;
        margin:40px auto;
        background:white;
        padding:20px;
        border-radius:10px;
        box-shadow:0 0 10px rgba(0,0,0,0.1);
    }

    h1{
        text-align:center;
    }

    input{
        width:100%;
        padding:10px;
        font-size:16px;
        margin-top:10px;
    }

    button{
        margin-top:10px;
        padding:10px 20px;
        font-size:16px;
        cursor:pointer;
    }

    ul{
        list-style:none;
        padding:0;
    }

    li{
        background:#eee;
        margin:8px 0;
        padding:10px;
        border-radius:6px;
        display:flex;
        justify-content:space-between;
        align-items:center;
    }

    .btn-group button{
        margin-left:10px;
    }

    pre{
        background:#222;
        color:#00ff88;
        padding:20px;
        overflow:auto;
        border-radius:10px;
        max-height:600px;
    }
</style>
</head>
<body>

<div class="login-box" id="loginBox">
    <h1>登录</h1>
    <input type="password" id="password" placeholder="请输入密码">
    <button onclick="login()">登录</button>
    <p id="error" style="color:red;"></p>
</div>

<div class="main-box" id="mainBox" style="display:none;">
    <h1>C 文件查看器</h1>

    <ul id="fileList"></ul>

    <h2>文件内容</h2>
    <pre id="codeArea">点击文件查看内容...</pre>
</div>

<script>

// =======================
// 配置区域
// =======================

const PASSWORD = "12345678";

// GitHub 仓库信息
const githubUser = "WangQiang-sys";
const repo = "code";
const branch = "main";

// 你的 .c 文件列表
const files = [
    "Calculated_Irradiation_Time.c",
    "file2.c",
    "file3.c",
    "file4.c"
];

// =======================
// 登录
// =======================

function login(){

    const pwd = document.getElementById("password").value;

    if(pwd === PASSWORD){

        document.getElementById("loginBox").style.display = "none";
        document.getElementById("mainBox").style.display = "block";

        loadFileList();

    }else{
        document.getElementById("error").innerText = "密码错误";
    }
}

// =======================
// 加载文件列表
// =======================

function loadFileList(){

    const ul = document.getElementById("fileList");

    files.forEach(file => {

        const li = document.createElement("li");

        const span = document.createElement("span");
        span.innerText = file;

        const btnGroup = document.createElement("div");
        btnGroup.className = "btn-group";

        // 查看按钮
        const viewBtn = document.createElement("button");
        viewBtn.innerText = "查看";
        viewBtn.onclick = () => viewFile(file);

        // 下载按钮
        const downloadBtn = document.createElement("button");
        downloadBtn.innerText = "下载";
        downloadBtn.onclick = () => downloadFile(file);

        btnGroup.appendChild(viewBtn);
        btnGroup.appendChild(downloadBtn);

        li.appendChild(span);
        li.appendChild(btnGroup);

        ul.appendChild(li);
    });
}

// =======================
// 查看文件
// =======================

async function viewFile(file){

    const rawUrl =
        `https://raw.githubusercontent.com/${githubUser}/${repo}/${branch}/${file}`;

    try{

        const response = await fetch(rawUrl);

        if(!response.ok){
            throw new Error("文件读取失败");
        }

        const text = await response.text();

        document.getElementById("codeArea").textContent = text;

    }catch(err){

        document.getElementById("codeArea").textContent =
            "读取失败: " + err;
    }
}

// =======================
// 下载文件
// =======================

function downloadFile(file){

    const rawUrl =
        `https://raw.githubusercontent.com/${githubUser}/${repo}/${branch}/${file}`;

    const a = document.createElement("a");

    a.href = rawUrl;
    a.download = file;

    document.body.appendChild(a);

    a.click();

    document.body.removeChild(a);
}

</script>

</body>
</html>
