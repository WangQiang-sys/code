<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini GitHub Viewer</title>

<link href="https://cdn.jsdelivr.net/npm/prismjs/themes/prism-tomorrow.css" rel="stylesheet"/>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#0d1117;
    color:#c9d1d9;
    font-family:Consolas, monospace;
    height:100vh;
    overflow:hidden;
}

/* ===== LOGIN ===== */
#loginPage{
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.login-box{
    width:320px;
    background:#161b22;
    padding:40px;
    border-radius:12px;
}

.login-box input{
    width:100%;
    padding:12px;
    margin-bottom:15px;
    background:#0d1117;
    color:white;
    border:1px solid #30363d;
    border-radius:6px;
}

.login-box button{
    width:100%;
    padding:12px;
    background:#238636;
    color:white;
    border:none;
    border-radius:6px;
    cursor:pointer;
}

/* ===== APP ===== */
#app{
    display:none;
    height:100vh;
    flex-direction:column;
}

/* ===== TOPBAR ===== */
.topbar{
    height:55px;
    background:#161b22;
    display:flex;
    align-items:center;
    gap:12px;
    padding:0 15px;
    border-bottom:1px solid #30363d;
}

.logo{
    font-weight:bold;
    white-space:nowrap;
}

.topbar input{
    flex:1;
    padding:10px;
    background:#0d1117;
    color:white;
    border:1px solid #30363d;
    border-radius:6px;
}

.topbar button{
    padding:8px 14px;
    border:none;
    background:#238636;
    color:white;
    border-radius:6px;
    cursor:pointer;
    white-space:nowrap;
}

/* ===== LAYOUT ===== */
.container{
    display:flex;
    flex:1;
    overflow:hidden;
}

/* ===== SIDEBAR ===== */
.sidebar{
    width:120px;
    background:#161b22;
    overflow:auto;
}

/* ===== RESIZER ===== */
.resizer{
    width:6px;
    background:#30363d;
    cursor:col-resize;
    transition:0.2s;
}

.resizer:hover{
    background:#238636;
}

/* ===== FILE ITEM ===== */
.file-item{
    padding:12px;
    cursor:pointer;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.file-item:hover{
    background:#21262d;
}

.file-item.active{
    background:#30363d;
}

/* ===== MAIN ===== */
.main{
    flex:1;
    overflow:hidden;
    display:flex;
    flex-direction:column;
}

.content{
    flex:1;
    overflow:auto;
    padding:20px;
}

pre{
    font-size:14px;
    line-height:1.5;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginPage">
    <div class="login-box">
        <h1 style="margin-bottom:20px;">Mini GitHub</h1>

        <input
            type="password"
            id="password"
            placeholder="Password"
        >

        <button onclick="login()">Login</button>

        <p id="error" style="color:red;margin-top:10px;"></p>
    </div>
</div>

<!-- APP -->
<div id="app">

    <!-- TOPBAR -->
    <div class="topbar">

        <div class="logo">Wang Qiang</div>

        <input
            id="searchInput"
            placeholder="Search file..."
            onkeyup="filterFiles()"
        >

        <button onclick="showHomePage()">Home</button>

        <button onclick="copyCode()">Copy</button>

        <button onclick="downloadFile()">Download</button>

    </div>

    <!-- BODY -->
    <div class="container">

        <!-- SIDEBAR -->
        <div class="sidebar" id="sidebar">
            <div id="fileList"></div>
        </div>

        <!-- RESIZER -->
        <div class="resizer" id="resizer"></div>

        <!-- MAIN -->
        <div class="main">
            <div class="content">
                <div id="viewer"></div>
            </div>
        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/prismjs/prism.js"></script>
<script src="https://cdn.jsdelivr.net/npm/prismjs/components/prism-c.min.js"></script>

<script>

const PASSWORD = "12345678";

const GITHUB_USER = "WangQiang-sys";
const REPO_NAME = "code";
const BRANCH = "main";

const files = [
    {name:"Calculated_Irradiation_Time.c", folder:""},
    {name:"r.c", folder:"HPGE"}
];

let folderState = {};
let currentText = "";
let currentRawUrl = "";

/* ===== LOGIN ===== */
function login(){

    const pwd = document.getElementById("password").value;

    if(pwd === PASSWORD){

        document.getElementById("loginPage").style.display = "none";

        document.getElementById("app").style.display = "flex";

        showHomePage();

    }else{

        document.getElementById("error").innerText = "Wrong Password";
    }
}

/* ===== TREE ===== */
function buildTree(list = files){

    const map = {};

    list.forEach(f => {

        if(!map[f.folder]){

            map[f.folder] = {
                name:f.folder,
                type:"folder",
                children:[]
            };
        }

        map[f.folder].children.push(f);
    });

    return Object.values(map);
}

function renderTree(tree, container){

    container.innerHTML = "";

    tree.forEach(item => {

        if(item.type === "folder"){

            const div = document.createElement("div");

            div.className = "file-item";

            const open = folderState[item.name];

            div.innerHTML = open
                ? `📂 ${item.name}`
                : `📁 ${item.name}`;

            div.onclick = () => {

                folderState[item.name] = !folderState[item.name];

                showHomePage();
            };

            container.appendChild(div);

            if(open){

                const sub = document.createElement("div");

                sub.style.paddingLeft = "18px";

                renderTree(item.children, sub);

                container.appendChild(sub);
            }

        }else{

            const div = document.createElement("div");

            div.className = "file-item";

            div.innerHTML = `📄 ${item.name}`;

            div.onclick = () => openFile(item);

            container.appendChild(div);
        }
    });
}

/* ===== HOME ===== */
function showHomePage(){

    const tree = buildTree(files);

    renderTree(
        tree,
        document.getElementById("fileList")
    );

    document.getElementById("viewer").innerHTML = "";

    currentText = "";

    currentRawUrl = "";
}

/* ===== OPEN FILE ===== */
async function openFile(file){

    currentRawUrl =
`https://raw.githubusercontent.com/${GITHUB_USER}/${REPO_NAME}/${BRANCH}/${file.folder}/${file.name}`;

    document.getElementById("viewer").innerHTML = "Loading...";

    try{

        const res = await fetch(currentRawUrl);

        const text = await res.text();

        currentText = text;

        document.getElementById("viewer").innerHTML =
`<pre><code class="language-c">${escapeHtml(text)}</code></pre>`;

        Prism.highlightAll();

    }catch(e){

        document.getElementById("viewer").innerHTML = "Load Failed";
    }
}

/* ===== SEARCH ===== */
function filterFiles(){

    const key =
        document.getElementById("searchInput")
        .value
        .toLowerCase();

    const filtered = files.filter(f =>
        f.name.toLowerCase().includes(key)
    );

    const tree = buildTree(filtered);

    renderTree(
        tree,
        document.getElementById("fileList")
    );
}

/* ===== COPY ===== */
function copyCode(){

    if(!currentText)
        return alert("No file opened");

    navigator.clipboard.writeText(currentText);

    alert("Copied!");
}

/* ===== DOWNLOAD ===== */
function downloadFile(){

    if(!currentRawUrl)
        return alert("No file opened");

    fetch(currentRawUrl)
        .then(r => r.blob())
        .then(blob => {

            const url = URL.createObjectURL(blob);

            const a = document.createElement("a");

            a.href = url;

            a.download = "file";

            document.body.appendChild(a);

            a.click();

            a.remove();

            URL.revokeObjectURL(url);
        });
}

/* ===== HTML ESCAPE ===== */
function escapeHtml(t){

    return t
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;");
}

/* ===== RESIZER ===== */
const sidebar = document.getElementById("sidebar");

const resizer = document.getElementById("resizer");

const container = document.querySelector(".container");

let isDragging = false;

resizer.addEventListener("mousedown", () => {

    isDragging = true;

    document.body.style.cursor = "col-resize";

    document.body.style.userSelect = "none";
});

document.addEventListener("mousemove", (e) => {

    if(!isDragging) return;

    const rect = container.getBoundingClientRect();

    let newWidth = e.clientX - rect.left;

    const min = 80;

    const max = rect.width - 80;

    if(newWidth < min)
        newWidth = min;

    if(newWidth > max)
        newWidth = max;

    sidebar.style.width = newWidth + "px";
});

document.addEventListener("mouseup", () => {

    isDragging = false;

    document.body.style.cursor = "default";

    document.body.style.userSelect = "auto";
});

</script>

</body>
</html>
