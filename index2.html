<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mini GitHub Viewer</title>

<link href="https://cdn.jsdelivr.net/npm/prismjs/themes/prism-tomorrow.css" rel="stylesheet"/>

<style>
/* ======（你的CSS完全没动，这里省略你原样粘贴）====== */
/* 为了避免太长，这部分保持你原代码原样即可 */
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginPage">
    <div class="login-box">
        <h1>Mini GitHub</h1>
        <input type="password" id="password" placeholder="Password">
        <button onclick="login()">Login</button>
        <p id="error" style="color:red;margin-top:10px;"></p>
    </div>
</div>

<!-- APP -->
<div id="app">

<div class="topbar">
    <div class="logo">Wang Qiang</div>

    <div class="search">
        <input type="text" id="searchInput" placeholder="Search file..." onkeyup="filterFiles()">
    </div>

    <button class="theme-btn" onclick="toggleTheme()">Theme</button>
</div>

<div class="container">

    <div class="sidebar">
        <div id="fileList"></div>
    </div>

    <div class="resizer" id="resizer"></div>

    <div class="main">

        <div class="file-header">
            <div id="currentFile">Repository Overview</div>

            <div class="file-actions">
                <button onclick="showHomePage()">Home</button>
                <button onclick="copyCode()">Copy</button>
                <button onclick="downloadFile()">Download</button>
            </div>
        </div>

        <div class="content">
            <div id="viewer"></div>
        </div>

    </div>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/prismjs/prism.js"></script>
<script src="https://cdn.jsdelivr.net/npm/prismjs/components/prism-c.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<script>

/* ================= CONFIG ================= */

const PASSWORD = "12345678";
const GITHUB_USER = "WangQiang-sys";
const REPO_NAME = "code";
const BRANCH = "main";

/* ================= FLAT FILES ================= */

const files = [
{
    name:"Calculated_Irradiation_Time.c",
    folder:"src",
    type:"C Source",
    modified:"2026-05-28",
    version:"v2.3"
},
{
    name:"test.h",
    folder:"include",
    type:"Header",
    modified:"2026-05-25",
    version:"v1.1"
}
];

/* ================= TREE ================= */

let allFilesTree = [];
let folderState = {};

/* ================= GLOBAL ================= */

let currentText = "";
let currentRawUrl = "";

/* ================= LOGIN ================= */

function login(){

    const pwd = document.getElementById("password").value;

    if(pwd === PASSWORD){
        document.getElementById("loginPage").style.display = "none";
        document.getElementById("app").style.display = "flex";
        initFiles();
    } else {
        document.getElementById("error").innerText = "Wrong Password";
    }
}

/* ================= INIT TREE ================= */

function initFiles(){

    const map = {};

    files.forEach(f => {

        if(!map[f.folder]){
            map[f.folder] = {
                name: f.folder,
                type: "folder",
                children: []
            };
        }

        map[f.folder].children.push(f);
    });

    allFilesTree = Object.values(map);

    showHomePage();
}

/* ================= RENDER TREE ================= */

function renderFiles(tree, container){

    container.innerHTML = "";

    tree.forEach(item => {

        if(item.type === "folder"){

            const folderDiv = document.createElement("div");
            folderDiv.className = "file-item";

            const isOpen = folderState[item.name];

            folderDiv.innerHTML = isOpen ? `📂 ${item.name}` : `📁 ${item.name}`;

            folderDiv.onclick = () => {
                folderState[item.name] = !folderState[item.name];
                showHomePage();
            };

            container.appendChild(folderDiv);

            if(isOpen){

                const sub = document.createElement("div");
                sub.style.paddingLeft = "20px";

                renderFiles(item.children, sub);

                container.appendChild(sub);
            }
        }

        else{

            const fileDiv = document.createElement("div");
            fileDiv.className = "file-item";

            fileDiv.innerHTML = `📄 ${item.name}`;

            fileDiv.onclick = () => openFile(item);

            container.appendChild(fileDiv);
        }
    });
}

/* ================= HOMEPAGE ================= */

function showHomePage(){

    document.querySelector(".sidebar").style.display = "block";
    document.querySelector(".resizer").style.display = "block";

    document.getElementById("currentFile").innerText = "Repository Overview";

    currentText = "";
    currentRawUrl = "";

    const viewer = document.getElementById("viewer");

    const wrap = document.createElement("div");
    wrap.className = "repo-list";

    const container = document.createElement("div");

    renderFiles(allFilesTree, container);

    wrap.appendChild(container);

    viewer.innerHTML = "";
    viewer.appendChild(wrap);
}

/* ================= OPEN FILE ================= */

async function openFile(file){

    document.getElementById("currentFile").innerText = file.name;

    currentRawUrl =
`https://raw.githubusercontent.com/${GITHUB_USER}/${REPO_NAME}/${BRANCH}/${file.name}`;

    document.querySelector(".sidebar").style.display = "block";
    document.querySelector(".resizer").style.display = "block";

    try{

        const res = await fetch(currentRawUrl);
        const text = await res.text();

        currentText = text;

        const viewer = document.getElementById("viewer");

        if(file.name.endsWith(".md")){
            viewer.innerHTML = `<div class="markdown">${marked.parse(text)}</div>`;
        } else {
            viewer.innerHTML = `
<pre><code class="language-c">${escapeHtml(text)}</code></pre>`;
            Prism.highlightAll();
        }

    } catch(e){
        document.getElementById("viewer").innerHTML = "<h2>Load Failed</h2>";
    }
}

/* ================= ESCAPE ================= */

function escapeHtml(text){
    return text
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;");
}

/* ================= COPY ================= */

function copyCode(){

    if(!currentText) return alert("No file opened");

    navigator.clipboard.writeText(currentText);
    alert("Copied!");
}

/* ================= DOWNLOAD ================= */

function downloadFile(){

    if(!currentRawUrl) return alert("No file opened");

    fetch(currentRawUrl)
        .then(r => r.blob())
        .then(blob => {

            const url = URL.createObjectURL(blob);

            const a = document.createElement("a");
            a.href = url;
            a.download = document.getElementById("currentFile").innerText;

            document.body.appendChild(a);
            a.click();
            a.remove();

            URL.revokeObjectURL(url);
        });
}

/* ================= THEME ================= */

function toggleTheme(){
    document.body.classList.toggle("light");
}

/* ================= SEARCH ================= */

function filterFiles(){

    const key = document.getElementById("searchInput").value.toLowerCase();

    const flat = files.filter(f => f.name.toLowerCase().includes(key));

    const map = {};

    flat.forEach(f => {
        if(!map[f.folder]){
            map[f.folder] = {
                name: f.folder,
                type: "folder",
                children: []
            };
        }
        map[f.folder].children.push(f);
    });

    renderFiles(Object.values(map), document.getElementById("fileList"));
}

/* ================= RESIZER ================= */

const resizer = document.getElementById("resizer");
const sidebar = document.querySelector(".sidebar");

let isResizing = false;

resizer.addEventListener("mousedown", () => {
    isResizing = true;
    document.body.style.cursor = "col-resize";
});

document.addEventListener("mousemove", (e) => {

    if(!isResizing) return;

    let w = e.clientX;
    if(w < 100) w = 100;
    if(w > 900) w = 900;

    sidebar.style.width = w + "px";
});

document.addEventListener("mouseup", () => {
    isResizing = false;
    document.body.style.cursor = "default";
});

</script>

</body>
</html>
